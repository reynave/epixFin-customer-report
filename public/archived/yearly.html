<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Tahunan (Yearly Report)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <div class="container my-2">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm mb-2 shadow-sm">
          <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>
        <h2 class="fw-bold text-dark mb-0">Laporan Tahunan (Yearly)</h2>
        <p class="text-muted mb-0">
          Database: <span id="db-name" class="fw-bold text-dark">-</span> |
          Periode: <span id="report-period" class="fw-bold text-dark">-</span>
        </p>
      </div>
      <div class="d-flex gap-2 ms-auto">
        <button class="btn btn-outline-secondary" onclick="window.print()">
          <i class="bi bi-printer me-1"></i> Cetak
        </button>
        <button class="btn btn-outline-secondary" onclick="exportToExcel()">
          <i class="bi bi-file-earmark-excel me-1"></i> Export *.xlsx
        </button>
      </div>
    </div>

    <!-- Filter Tanggal -->
    <div class="card border-0 shadow-sm mt-3">
      <div class="card-body py-3">
        <form id="filter-form" class="row g-2 align-items-end">
          <div class="col-auto">
            <label for="start-date" class="form-label small text-muted mb-1">Start Date</label>
            <input type="date" id="start-date" class="form-control" value="2026-01-01">
          </div>
          <div class="col-auto">
            <label for="end-date" class="form-label small text-muted mb-1">End Date</label>
            <input type="date" id="end-date" class="form-control" value="2026-12-31">
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-dark">
              <i class="bi bi-funnel me-1"></i> Terapkan
            </button>
          </div>
          <div class="col-auto">
            <button type="button" class="btn btn-outline-secondary" onclick="resetFilter()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Reset
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Summary Cards -->
    <div class="row g-3 my-1 mb-4">
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <span class="text-muted small fw-medium">Total GRN</span>
            <h3 class="fw-bold text-primary mt-2 mb-0" id="stat-total-grn">Rp 0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <span class="text-muted small fw-medium">Total Invoice</span>
            <h3 class="fw-bold text-dark mt-2 mb-0" id="stat-total-invoice">Rp 0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <span class="text-muted small fw-medium">Total Payment</span>
            <h3 class="fw-bold text-success mt-2 mb-0" id="stat-total-payment">Rp 0</h3>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <span class="text-muted small fw-medium">Total Balance</span>
            <h3 class="fw-bold text-danger mt-2 mb-0" id="stat-total-balance">Rp 0</h3>
          </div>
        </div>
      </div>
    </div>
    <!-- Table Report Container -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 border-0">
        <div class="row align-items-center">
          <div class="col">
            <h6 class="fw-bold text-dark mb-0">Rekap Per Bulan</h6>
          </div>
          <div class="col text-md-end">
            <span class="text-muted small" id="search-count">Menampilkan seluruh data</span>
          </div>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="report-table">
            <thead class="table-light sticky-top">
              <tr>
                <th scope="col" class="ps-4">Bulan</th>
                <th scope="col" class="text-end">GRN Amount</th>
                <th scope="col" class="text-end">Total Invoice</th>
                <th scope="col" class="text-end">Total Payment</th>
                <th scope="col" class="text-end pe-4">Balance</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <!-- Data JSON dimuat di sini -->
            </tbody>
            <tfoot class="table-group-divider fw-bold bg-light">
              <tr>
                <td class="ps-4">TOTAL</td>
                <td class="text-end" id="foot-grn">Rp 0</td>
                <td class="text-end" id="foot-invoice">Rp 0</td>
                <td class="text-end" id="foot-payment">Rp 0</td>
                <td class="text-end pe-4" id="foot-balance">Rp 0</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="my-3 text-muted text-center small">
    <small>Ver 1.260827.0</small>
  </div>

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <script>
    let globalYearlyData = [];

    const MONTH_NAMES = [
      'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
      'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];

    function getDbName() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('dbName') || 'EpixFIN_RMM';
    }

    function getBaseUrl() {
      if (window.location.origin && window.location.origin.startsWith('http')) {
        return window.location.origin;
      }
      return 'http://localhost:3000';
    }

    function formatNumber(number) {
      if (number === null || number === undefined || number === '') return null;
      const n = Number(number);
      if (isNaN(n)) return null;
      return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(n);
    }

    function toNumber(value) {
      const n = Number(value);
      return isNaN(n) ? 0 : n;
    }

    function moneyCell(value) {
      const formatted = formatNumber(value);
      if (formatted === null) {
        return '<span class="text-muted">-</span>';
      }
      return 'Rp ' + formatted;
    }

    function monthLabel(year, month) {
      const idx = (Number(month) || 1) - 1;
      const name = MONTH_NAMES[idx] || ('Bulan ' + month);
      return name + ' ' + (year || '');
    }
    function renderTable(dataset) {
      const $tbody = $('#report-body');
      $tbody.empty();

      let totalGrn = 0;
      let totalInv = 0;
      let totalPayment = 0;
      let totalBalance = 0;

      if (!dataset || dataset.length === 0) {
        $tbody.append(`
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              <i class="bi bi-search me-1"></i> Tidak ada data ditemukan.
            </td>
          </tr>
        `);
      } else {
        dataset.forEach(function (item) {
          const grn = toNumber(item.GrnAmount);
          const inv = toNumber(item.totalInv);
          const payment = toNumber(item.totalPayment);
          const balance = toNumber(item.balance);

          totalGrn += grn;
          totalInv += inv;
          totalPayment += payment;
          totalBalance += balance;

          let balanceClass = '';
          if (item.balance === null || item.balance === undefined || item.balance === '') {
            balanceClass = 'text-muted';
          } else if (balance > 0) {
            balanceClass = 'text-success fw-semibold';
          } else if (balance < 0) {
            balanceClass = 'text-danger fw-semibold';
          }

          const row = `
            <tr>
              <td class="ps-4 fw-semibold">${monthLabel(item.Year, item.Month)}</td>
              <td class="text-end">${moneyCell(item.GrnAmount)}</td>
              <td class="text-end">${moneyCell(item.totalInv)}</td>
              <td class="text-end">${moneyCell(item.totalPayment)}</td>
              <td class="text-end pe-4 ${balanceClass}">${moneyCell(item.balance)}</td>
            </tr>
          `;
          $tbody.append(row);
        });
      }

      $('#stat-total-grn').text('Rp ' + formatNumber(totalGrn));
      $('#stat-total-invoice').text('Rp ' + formatNumber(totalInv));
      $('#stat-total-payment').text('Rp ' + formatNumber(totalPayment));
      $('#stat-total-balance').text('Rp ' + formatNumber(totalBalance));

      $('#foot-grn').text('Rp ' + formatNumber(totalGrn));
      $('#foot-invoice').text('Rp ' + formatNumber(totalInv));
      $('#foot-payment').text('Rp ' + formatNumber(totalPayment));
      $('#foot-balance').text('Rp ' + formatNumber(totalBalance));

      $('#search-count').text(`Menampilkan ${dataset ? dataset.length : 0} bulan`);
    }

    function fetchYearlyData() {
      const dbName = getDbName();
      const startDate = $('#start-date').val();
      const endDate = $('#end-date').val();

      if (!startDate || !endDate) {
        $('#report-body').html(`
          <tr>
            <td colspan="5" class="text-center py-4 text-warning">
              <i class="bi bi-exclamation-triangle-fill me-1"></i>
              Silakan isi Start Date dan End Date terlebih dahulu.
            </td>
          </tr>
        `);
        return;
      }

      $('#db-name').text(dbName);
      $('#report-period').text(`${startDate} s/d ${endDate}`);

      const apiUrl = `${getBaseUrl()}/${dbName}/yearly?startDate=${startDate}&endDate=${endDate}`;

      $('#report-body').html(`
        <tr>
          <td colspan="5" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2 mb-0">Mengambil data dari server...</p>
          </td>
        </tr>
      `);

      $.get(apiUrl)
        .done(function (response) {
          const res = typeof response === 'string' ? JSON.parse(response) : response;

          if (res.status === 'error') {
            throw new Error(res.error || 'Terjadi kesalahan pada server.');
          }

          $('#db-name').text(res.requestedDb || dbName);
          if (res.filter) {
            $('#report-period').text(`${res.filter.startDate} s/d ${res.filter.endDate}`);
          }

          globalYearlyData = res.data || [];
          renderTable(globalYearlyData);
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
          console.error('Error fetching data:', textStatus, errorThrown);
          $('#report-body').html(`
            <tr>
              <td colspan="5" class="text-center py-4 text-danger">
                <i class="bi bi-exclamation-triangle-fill fs-4 d-block mb-2"></i>
                Gagal mengambil data dari server (<code>${apiUrl}</code>).
              </td>
            </tr>
          `);
        });
    }
    function exportToExcel() {
      if (!globalYearlyData || globalYearlyData.length === 0) {
        alert('Tidak ada data untuk diexport.');
        return;
      }

      const exportData = globalYearlyData.map(function (item) {
        return {
          'Tahun': item.Year || '',
          'Bulan': monthLabel(item.Year, item.Month),
          'GRN Amount': item.GrnAmount,
          'Total Invoice': item.totalInv,
          'Total Payment': item.totalPayment,
          'Balance': item.balance
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      worksheet['!cols'] = [
        { wch: 8 },
        { wch: 18 },
        { wch: 16 },
        { wch: 18 },
        { wch: 18 },
        { wch: 18 }
      ];

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Laporan Tahunan');

      const safeDbName = getDbName().replace(/[^a-z0-9_-]/gi, '_');
      XLSX.writeFile(workbook, `laporan-tahunan-${safeDbName}.xlsx`);
    }

    function resetFilter() {
      $('#start-date').val('2026-01-01');
      $('#end-date').val('2026-12-31');
      fetchYearlyData();
    }

    $(document).ready(function () {
      fetchYearlyData();

      $('#filter-form').on('submit', function (e) {
        e.preventDefault();
        fetchYearlyData();
      });
    });
  </script>
</body>

</html>
