<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Customer / Supplier</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

  <div class="container my-2">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm mb-2 shadow-sm">
          <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>
        <h2 class="fw-bold text-dark mb-0">Daftar Customer / Supplier</h2>
        <p class="text-muted mb-0">
          Database: <span id="db-name" class="fw-bold text-dark">-</span>
        </p>
      </div>
    </div>

    <!-- Table Container -->
    <div class="card border-0 shadow-sm mt-3">
      <!-- Search Bar Toolbar -->
      <div class="card-header bg-white py-3 border-0">
        <div class="row align-items-center">
          <div class="col">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" id="search-input" class="form-control bg-light border-start-0"
                placeholder="Cari Nama atau ID Supplier...">
            </div>
          </div>
          <div class="col text-md-end mt-2 mt-md-0">
            <span class="text-muted small" id="search-count">Menampilkan seluruh data</span>
          </div>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="report-table">
            <thead class="table-light sticky-top">
              <tr>
                <th scope="col" class="ps-4">Supplier</th>
                <th scope="col">ID Supplier</th>
              </tr>
            </thead>
            <tbody id="report-body">
              <!-- Data JSON dimuat di sini -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="my-3 text-muted text-center small">
    <small>Ver 1.260827.0</small>
  </div>

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let globalCustomerData = [];

    function renderTable(dataset) {
      const $tbody = $('#report-body');
      $tbody.empty();

      if (!dataset || dataset.length === 0) {
        $tbody.append(`
          <tr>
            <td colspan="2" class="text-center py-4 text-muted">Tidak ada data ditemukan.</td>
          </tr>
        `);
      } else {
        dataset.forEach(function (item) {
          const row = `
            <tr>
              <td class="ps-4 fw-semibold">${item.SupplierName || '-'}</td>
              <td><code class="text-secondary">${item.SupplierID || '-'}</code></td>
            </tr>
          `;
          $tbody.append(row);
        });
      }

      $('#search-count').text(`Menampilkan ${dataset ? dataset.length : 0} dari ${globalCustomerData.length} supplier`);
    }

    function fetchCustomerData() {
      const urlParams = new URLSearchParams(window.location.search);
      const dbName = urlParams.get('dbName') || 'EpixFIN_RMM';

      $('#db-name').text(dbName);

      const apiUrl = `http://localhost:3000/${dbName}/getCustomer`;

      $('#report-body').html(`
        <tr>
          <td colspan="2" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2 mb-0">Mengambil data dari server...</p>
          </td>
        </tr>
      `);

      $.get(apiUrl)
        .done(function (response) {
          const res = typeof response === 'string' ? JSON.parse(response) : response;

          $('#db-name').text(res.requestedDb || dbName);
          globalCustomerData = res.data || [];
          renderTable(globalCustomerData);
        })
        .fail(function (jqXHR, textStatus, errorThrown) {
          console.error('Error fetching data:', textStatus, errorThrown);
          $('#report-body').html(`
            <tr>
              <td colspan="2" class="text-center py-4 text-danger">
                <i class="bi bi-exclamation-triangle-fill fs-4 d-block mb-2"></i>
                Gagal mengambil data dari server (<code>${apiUrl}</code>).
              </td>
            </tr>
          `);
        });
    }

    $(document).ready(function () {
      fetchCustomerData();

      $('#search-input').on('keyup input', function () {
        const keyword = $(this).val().toLowerCase().trim();

        const filteredData = globalCustomerData.filter(function (item) {
          return (item.SupplierName && item.SupplierName.toLowerCase().includes(keyword)) ||
            (item.SupplierID && item.SupplierID.toLowerCase().includes(keyword));
        });

        renderTable(filteredData);
      });
    });
  </script>
</body>
</html>
